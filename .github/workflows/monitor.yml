name: Scheduled 3-Day Project Monitor & Diagnostics

on:
  schedule:
    # Run every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor-and-diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Diagnostics & Generate Health Report
        id: diagnostics
        run: npm run monitor

      - name: Upload Health Diagnostic Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-diagnostic-report
          path: reports/health-report.md

      - name: Append to GitHub Job Summary
        if: always()
        run: |
          if [ -f reports/health-report.md ]; then
            cat reports/health-report.md >> $GITHUB_STEP_SUMMARY
          fi
